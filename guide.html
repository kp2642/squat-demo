<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>운동 시범·가이드</title>
<style>
:root{--blue:#2457D6;--ink:#1A1A1A;--muted:#5F5F5F;--line:#E6E6E6;--soft:#F5F6F8;--warn:#B35900}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px}
header a{color:var(--blue);text-decoration:none;font-size:15px;font-weight:600;padding:6px 0}
header h1{margin:0 0 0 auto;font-size:15px;color:var(--muted);font-weight:600}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom) + 32px)}
.seg{display:grid;gap:6px;grid-auto-flow:column;grid-auto-columns:1fr}
.seg button{height:42px;border:none;border-radius:10px;background:#F2F2F2;color:var(--ink);font-size:15px}
.seg button.sel{background:var(--blue);color:#fff;font-weight:700}
.seg.small button{height:34px;font-size:13px}
#stageBox{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;background:linear-gradient(#EEF1F6,#DCE1EA);aspect-ratio:4/3;touch-action:none}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#caption{margin-top:8px;background:#F0F3F9;color:var(--ink);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600;line-height:1.4;text-align:center;min-height:44px}
#hint{position:absolute;top:10px;right:12px;font-size:12px;color:#556;background:rgba(255,255,255,.75);border-radius:999px;padding:4px 10px}
.ctl{display:flex;gap:6px;margin-top:10px}
.ctl .seg{flex:1}
.ctl > button{height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px;padding:0 12px;color:var(--ink)}
h2{font-size:18px;margin:28px 0 10px}
h3{font-size:15px;margin:18px 0 8px}
ol,ul{margin:0;padding-left:20px;line-height:1.65;font-size:15px}
li{margin:2px 0}
p{font-size:15px;line-height:1.6;margin:8px 0}
.note{font-size:13px;color:var(--muted);line-height:1.55}
.box{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:10px}
.box.warn{background:#FFF4E8}
.box.warn b{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
th,td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:left;vertical-align:top;line-height:1.45}
th{font-size:13px;color:var(--muted);font-weight:600}
td:first-child{font-weight:600;width:34%}
.tabs{margin-top:22px}
#styleRow{margin-top:8px}
.embed header,.embed #ex,.embed #styleRow,.embed .ctl,.embed #tab,.embed #how,.embed #judge,.embed #hint{display:none!important}
.embed .wrap{padding:0;max-width:none}
.embed #stageBox{margin-top:0;border-radius:0}
.nocap #caption{display:none}
.embed #caption{margin-top:0;border-radius:0;font-size:13px;padding:6px 8px;min-height:0}
</style>
<script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('embed')</script>
</head>
<body>
<header>
  <a id="back" href="./">← 데모로</a>
  <h1>시범·가이드</h1>
</header>
<div class="wrap">
  <div class="seg" id="ex">
    <button data-v="squat">스쿼트</button><button data-v="goodmorning">굿모닝</button><button data-v="pushup">푸시업</button>
  </div>
  <div class="seg small" id="styleRow"><button data-v="knees">무릎 대고</button><button data-v="full">기본</button></div>

  <div id="stageBox">
    <canvas id="stage"></canvas>
    <div id="hint">끌어서 돌려보기</div>
  </div>
  <div id="caption"></div>
  <div class="ctl">
    <div class="seg small" id="view"><button data-v="side">옆</button><button data-v="angle">비스듬히</button><button data-v="front">앞</button></div>
    <button id="speed">느리게</button>
    <button id="play">멈춤</button>
  </div>

  <div class="seg tabs" id="tab"><button data-v="how" class="sel">하는 법</button><button data-v="judge">판정 가이드</button></div>
  <div id="how"></div>
  <div id="judge" style="display:none"></div>
</div>

<script type="module">
const THREE = await import(window.THREE_URL || 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js');
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
let ex = q.get('ex') || 'squat';
let side = q.get('side') === 'L' ? 'L' : 'R', back = q.get('dir') === 'back';
if (q.get('nocap') === '1') document.documentElement.classList.add('nocap');
let pstyle = q.get('style') === 'full' ? 'full' : 'knees';
let view = 'side', speed = 1, playing = true;

// ── 몸 치수 (m) ──
const LEN = { shin: 0.44, thigh: 0.44, torso: 0.52, upper: 0.30, fore: 0.27 };
const D = Math.PI / 180;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// 두 마디 관절(팔) 위치 계산: 뿌리 S, 끝 W, 팔꿈치가 향할 방향 pole
function ik(S, W, a, b, pole) {
  const d = Math.min(a + b - 1e-4, S.distanceTo(W));
  const dir = W.clone().sub(S).normalize();
  const cosA = (a * a + d * d - b * b) / (2 * a * d), sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));
  const p = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
  return S.clone().add(dir.multiplyScalar(a * cosA)).add(p.multiplyScalar(a * sinA));
}
function head(J, neckBase, dir) { J.neck = neckBase; J.head = neckBase.clone().add(dir.clone().multiplyScalar(0.19)); }

// ── 종목별 자세 (p: 0 = 시작 자세, 1 = 가장 낮은 자세). 사람은 +x 방향을 봄, z+가 오른쪽 ──
const POSE = {
  // 스쿼트: 무릎 70°(허벅지 거의 평행), 상체는 정강이와 비슷한 기울기, 팔은 앞으로 뻗어 균형
  squat(p) {
    const J = {}, ths = 30 * p * D, tht = 80 * p * D, lam = 34 * p * D;
    for (const [s, z] of [['L', -1], ['R', 1]]) {
      const ankle = V(0, 0.08, 0.16 * z);
      const knee = V(Math.sin(ths) * LEN.shin, 0.08 + Math.cos(ths) * LEN.shin, (0.16 + 0.03 * p) * z);
      const hip = V(knee.x - Math.sin(tht) * LEN.thigh, knee.y + Math.cos(tht) * LEN.thigh, 0.1 * z);
      Object.assign(J, { [s + 'ankle']: ankle, [s + 'knee']: knee, [s + 'hip']: hip, [s + 'heel']: V(-0.06, 0.03, 0.16 * z), [s + 'toe']: V(0.17, 0.02, 0.2 * z) });
    }
    const pelvis = J.Lhip.clone().add(J.Rhip).multiplyScalar(0.5), u = V(Math.sin(lam), Math.cos(lam), 0);
    const sc = pelvis.clone().add(u.clone().multiplyScalar(LEN.torso));
    const al = (25 + 65 * p) * D, adir = V(Math.sin(al), -Math.cos(al), 0);
    for (const [s, z] of [['L', -1], ['R', 1]]) {
      const sh = sc.clone().add(V(0, 0, 0.19 * z)), el = sh.clone().add(adir.clone().multiplyScalar(LEN.upper));
      Object.assign(J, { [s + 'shoulder']: sh, [s + 'elbow']: el, [s + 'wrist']: el.clone().add(adir.clone().multiplyScalar(LEN.fore)) });
    }
    J.pelvis = pelvis; J.chest = sc;
    head(J, sc.clone().add(u.clone().multiplyScalar(0.05)), V(Math.sin(0.5 * lam), Math.cos(0.5 * lam), 0));
    return J;
  },
  // 굿모닝: 무릎은 살짝(약 158°), 엉덩이를 뒤로, 등은 곧게 상체 78°까지, 손은 가슴에 X자
  goodmorning(p) {
    const J = {}, ths = (2 + 3 * p) * D, tht = (3 + 17 * p) * D, lam = 78 * p * D;
    for (const [s, z] of [['L', -1], ['R', 1]]) {
      const ankle = V(0, 0.08, 0.12 * z);
      const knee = V(Math.sin(ths) * LEN.shin, 0.08 + Math.cos(ths) * LEN.shin, 0.12 * z);
      const hip = V(knee.x - Math.sin(tht) * LEN.thigh, knee.y + Math.cos(tht) * LEN.thigh, 0.1 * z);
      Object.assign(J, { [s + 'ankle']: ankle, [s + 'knee']: knee, [s + 'hip']: hip, [s + 'heel']: V(-0.06, 0.03, 0.12 * z), [s + 'toe']: V(0.17, 0.02, 0.14 * z) });
    }
    const pelvis = J.Lhip.clone().add(J.Rhip).multiplyScalar(0.5);
    const u = V(Math.sin(lam), Math.cos(lam), 0), f = V(Math.cos(lam), -Math.sin(lam), 0);
    const sc = pelvis.clone().add(u.clone().multiplyScalar(LEN.torso));
    const sh = { L: sc.clone().add(V(0, 0, -0.19)), R: sc.clone().add(V(0, 0, 0.19)) };
    for (const [s, o, z] of [['L', 'R', -1], ['R', 'L', 1]]) {
      const wrist = sh[o].clone().add(f.clone().multiplyScalar(0.11)).add(u.clone().multiplyScalar(-0.04)).setZ(-0.1 * z);
      const el = ik(sh[s], wrist, LEN.upper, LEN.fore, f.clone().multiplyScalar(0.6).add(u.clone().multiplyScalar(-1)).add(V(0, 0, 0.5 * z)));
      Object.assign(J, { [s + 'shoulder']: sh[s], [s + 'elbow']: el, [s + 'wrist']: wrist });
    }
    J.pelvis = pelvis; J.chest = sc;
    head(J, sc.clone().add(u.clone().multiplyScalar(0.05)), u.clone().add(f.clone().multiplyScalar(0.12)).normalize()); // 고개는 등과 일직선
    return J;
  },
  // 푸시업: 머리부터 발끝(무릎)까지 일직선, 팔꿈치는 몸통에서 약 40°만 벌려 뒤로 굽힘, 바닥에서 팔꿈치 약 80°
  pushup(p) {
    const J = {}, knees = pstyle === 'knees';
    const wy = 0.04, wz = 0.26, sz = 0.19;
    const R = knees ? LEN.thigh + LEN.torso : LEN.shin + LEN.thigh + LEN.torso;
    const A = knees ? V(0, 0.06, 0) : V(0, 0.11, 0); // 회전 중심: 무릎 또는 발목
    const armD = (e) => Math.sqrt(LEN.upper ** 2 + LEN.fore ** 2 - 2 * LEN.upper * LEN.fore * Math.cos(e * D));
    const reach2 = (e) => Math.sqrt(Math.max(0, armD(e) ** 2 - (wz - sz) ** 2));
    // 팔을 다 편 시작 자세에서 손목이 어깨 바로 아래 오도록 회전 중심의 x를 정함
    const topY = wy + reach2(179.5);
    A.x = -Math.sqrt(R * R - (topY - A.y) ** 2);
    const e = 179.5 - (179.5 - (knees ? 72 : 80)) * p, r2 = reach2(e); // 무릎 대고는 몸이 짧아 더 굽혀야 가슴이 바닥 가까이 감
    // 어깨: 회전 중심에서 R, 손목에서 r2 떨어진 점(두 원의 교점 중 위쪽)
    const W = V(0, wy, 0), dx = W.x - A.x, dy = W.y - A.y, d = Math.hypot(dx, dy);
    const a = (R * R - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, R * R - a * a));
    const mx = A.x + a * dx / d, my = A.y + a * dy / d;
    const S2 = V(mx - h * dy / d, my + h * dx / d, 0);
    const S = S2.y > my ? S2 : V(mx + h * dy / d, my - h * dx / d, 0);
    const dir = S.clone().sub(A).normalize();
    for (const [s, z] of [['L', -1], ['R', 1]]) {
      let ankle, knee;
      if (knees) { knee = V(A.x, A.y, 0.1 * z); ankle = V(A.x - LEN.shin, 0.06, 0.09 * z); }
      else { ankle = V(A.x, A.y, 0.09 * z); knee = ankle.clone().add(dir.clone().multiplyScalar(LEN.shin)).setZ(0.1 * z); }
      const hip = V(A.x, A.y, 0).add(dir.clone().multiplyScalar(knees ? LEN.thigh : LEN.shin + LEN.thigh)).setZ(0.1 * z);
      const heel = knees ? ankle.clone().add(V(-0.02, 0.06, 0)) : ankle.clone().add(V(-0.05, 0.07, 0));
      const toe = knees ? ankle.clone().add(V(-0.18, -0.03, 0)) : V(ankle.x + 0.09, 0.0, 0.09 * z);
      const sh = S.clone().setZ(sz * z), wr = V(0, wy, wz * z);
      const el = ik(sh, wr, LEN.upper, LEN.fore, V(-Math.cos(40 * D), 0.15, Math.sin(40 * D) * z));
      Object.assign(J, { [s + 'ankle']: ankle, [s + 'knee']: knee, [s + 'hip']: hip, [s + 'heel']: heel, [s + 'toe']: toe, [s + 'shoulder']: sh, [s + 'elbow']: el, [s + 'wrist']: wr });
    }
    J.pelvis = J.Lhip.clone().add(J.Rhip).multiplyScalar(0.5); J.chest = S;
    head(J, S.clone().add(dir.clone().multiplyScalar(0.05)), dir); // 고개는 몸과 일직선
    return J;
  },
};

// ── v32: 워밍업·쿨다운 동작 (t: 초, 계속 반복) ──
const sn = (d) => Math.sin(d * D), cs = (d) => Math.cos(d * D);
const wave = (t, per) => 0.5 - 0.5 * Math.cos(2 * Math.PI * t / per); // 0 → 1 → 0
// 다리: 엉덩이 H에서 허벅지 a°(수직 아래 기준 앞으로 +), 무릎 굽힘 k°(+면 정강이가 뒤로), 발끝 f°(+면 위로)
function leg(J, s, H, a, k, f = 0) {
  const knee = H.clone().add(V(sn(a) * LEN.thigh, -cs(a) * LEN.thigh, 0)), g = a - k;
  const ankle = knee.clone().add(V(sn(g) * LEN.shin, -cs(g) * LEN.shin, 0));
  const fd = V(cs(g + f), sn(g + f), 0), sd = V(sn(g), -cs(g), 0);
  Object.assign(J, { [s + 'hip']: H, [s + 'knee']: knee, [s + 'ankle']: ankle,
    [s + 'heel']: ankle.clone().add(fd.clone().multiplyScalar(-0.06)).add(sd.clone().multiplyScalar(0.05)),
    [s + 'toe']: ankle.clone().add(fd.clone().multiplyScalar(0.17)).add(sd.clone().multiplyScalar(0.06)) });
}
// 팔: 위팔 b°(수직 아래 기준 앞으로 +), 팔꿈치 굽힘 e°
function arm(J, s, Sh, b, e) {
  const el = Sh.clone().add(V(sn(b) * LEN.upper, -cs(b) * LEN.upper, 0)), h = b + e;
  Object.assign(J, { [s + 'shoulder']: Sh, [s + 'elbow']: el, [s + 'wrist']: el.clone().add(V(sn(h) * LEN.fore, -cs(h) * LEN.fore, 0)) });
}
const zs = (s, w) => (s === 'L' ? -w : w);
// 서 있는 자세: 낮은 쪽 발이 바닥에 닿게 골반 높이를 정함
function standing({ legs, lean = 0, arms = {}, look = null }) {
  const drop = ([a, k]) => cs(a) * LEN.thigh + cs(a - k) * LEN.shin;
  const y = 0.08 + Math.max(drop(legs.L), drop(legs.R)), J = {};
  for (const s of ['L', 'R']) leg(J, s, V(0, y, zs(s, 0.1)), ...legs[s]);
  const P = V(0, y, 0), u = V(sn(lean), cs(lean), 0), C = P.clone().add(u.clone().multiplyScalar(LEN.torso));
  J.pelvis = P; J.chest = C;
  for (const s of ['L', 'R']) { const Sh = C.clone().add(V(0, 0, zs(s, 0.19))); if (arms[s]) arm(J, s, Sh, ...arms[s]); else J[s + 'shoulder'] = Sh; }
  head(J, C.clone().add(u.clone().multiplyScalar(0.05)), look || u);
  return J;
}
const other = (s) => (s === 'L' ? 'R' : 'L');
function onWall(J, s, W) { // 손을 벽에 짚음
  J[s + 'wrist'] = W; J[s + 'elbow'] = ik(J[s + 'shoulder'], W, LEN.upper, LEN.fore, V(-0.2, -1, zs(s, 0.6)));
}
function handOnHip(J, s) { J[s + 'wrist'] = J.pelvis.clone().add(V(0.08, 0.1, zs(s, 0.17))); J[s + 'elbow'] = ik(J[s + 'shoulder'], J[s + 'wrist'], LEN.upper, LEN.fore, V(-0.4, 0, zs(s, 1))); }
function kneeling(J, hipX, hipY, kneeX) { // 무릎 꿇기: 정강이·발등이 바닥에
  for (const s of ['L', 'R']) {
    const z = zs(s, 0.1), knee = V(kneeX, 0.06, z), ankle = V(kneeX - LEN.shin, 0.06, z * 0.9);
    Object.assign(J, { [s + 'hip']: V(hipX, hipY, z), [s + 'knee']: knee, [s + 'ankle']: ankle, [s + 'heel']: ankle.clone().add(V(0.02, 0.05, 0)), [s + 'toe']: ankle.clone().add(V(-0.15, -0.03, 0)) });
  }
}
// 스트레칭: 준비 → 들어가기 → 유지 → 풀기 (0 → 1 → 1 → 0)
function cyc(t, T = [0.7, 1.3, 2.6, 1.1]) {
  const total = T.reduce((a, b) => a + b, 0); let x = t % total;
  if (x < T[0]) return 0; x -= T[0]; if (x < T[1]) return ease(x / T[1]);
  x -= T[1]; if (x < T[2]) return 1; x -= T[2]; return 1 - ease(x / T[3]);
}
const lerp = (a, b, p) => a + (b - a) * p;
const LEG_KEYS = (s) => [s + 'hip', s + 'knee', s + 'ankle', s + 'heel'];
// 손을 hand 위치로 옮기고 팔꿈치는 IK로
function reach(J, s, W, pole) { J[s + 'wrist'] = W; J[s + 'elbow'] = ik(J[s + 'shoulder'], W, LEN.upper, LEN.fore, pole); }
const MOVES = {
  march(t, amp = 1, per = 1.0) {
    const ph = 2 * Math.PI * t / per, sn1 = Math.sin(ph), r = Math.max(0, sn1), l = Math.max(0, -sn1);
    const J = standing({ legs: { R: [70 * r * amp, 90 * r * amp, 10 * r], L: [70 * l * amp, 90 * l * amp, 10 * l] }, lean: 4,
      arms: { R: [-45 * sn1 * amp, 80], L: [45 * sn1 * amp, 80] } });
    return J;
  },
  slowwalk(t) { return MOVES.march(t, 0.5, 1.7); },
  armcircle(t) {
    const b = ((back ? -1 : 1) * 225 * t) % 360;
    return standing({ legs: { R: [0, 0], L: [0, 0] }, arms: { R: [b, 4], L: [b, 4] }, lean: 0 });
  },
  legswing(t) {
    const sw = Math.sin(2 * Math.PI * t / 1.4), legs = { [side]: [12 + 45 * sw, 14 - 10 * sw, 10 * sw], [other(side)]: [0, 0] };
    const J = standing({ legs, lean: 2 - 4 * sw });
    onWall(J, other(side), V(-0.12, 1.15, zs(other(side), 0.47))); handOnHip(J, side); J.wallZ = zs(other(side), 0.5); J.wallX = -0.12; // 벽은 옆에, 벽 쪽 손으로 짚고 바깥 다리를 앞뒤로
    J.hl = LEG_KEYS(side);
    return J;
  },
  hinge(t) { return POSE.goodmorning(0.75 * wave(t, 3)); },
  halfsquat(t) { return POSE.squat(0.62 * wave(t, 2.8)); },
  wallpush(t) {
    const th = 16 + 16 * wave(t, 2.6), u = V(sn(th), cs(th), 0), J = {};
    for (const s of ['L', 'R']) {
      const z = zs(s, 0.1), ankle = V(0, 0.08, z);
      Object.assign(J, { [s + 'ankle']: ankle, [s + 'knee']: ankle.clone().add(u.clone().multiplyScalar(LEN.shin)), [s + 'hip']: ankle.clone().add(u.clone().multiplyScalar(LEN.shin + LEN.thigh)), [s + 'heel']: ankle.clone().add(V(-0.06, -0.05, 0)), [s + 'toe']: ankle.clone().add(V(0.17, -0.06, 0)) });
    }
    J.pelvis = V(0, 0, 0).add(J.Lhip).add(J.Rhip).multiplyScalar(0.5); J.chest = J.pelvis.clone().add(u.clone().multiplyScalar(LEN.torso));
    for (const s of ['L', 'R']) { J[s + 'shoulder'] = J.chest.clone().add(V(0, 0, zs(s, 0.19))); onWall(J, s, V(0.97, 1.33, zs(s, 0.24))); }
    head(J, J.chest.clone().add(u.clone().multiplyScalar(0.05)), u); J.wallX = 1.0;
    return J;

  catcow(t) {

    how: `<h2>하는 법</h2><ol>
<li>손은 어깨보다 조금 넓게 짚고, 손목이 어깨 바로 아래 오게 해요.</li>
<li>머리부터 발끝(무릎 대고 할 때는 무릎)까지 일직선. 배와 엉덩이에 힘을 줘요.</li>
<li>팔꿈치를 옆으로 벌리지 말고, 몸통에서 30~45°만 벌린 채 뒤쪽으로 굽혀요. 위에서 보면 화살표(↑) 모양이에요.</li>

<h3>단계</h3><ul><li>의자 짚고 → 무릎 대고 → 기본 순서. 바른 자세로 12회씩 2세트가 되면 다음 단계로.</li></ul>

    judge: `<h2>판정 가이드</h2><p>팔꿈치 각도(어깨-팔꿈치-손목)와 어깨-엉덩이-발목(무릎) 선으로 판정해요.</p>

function renderText() { $('how').innerHTML = T[ex] ? T[ex].how : ''; $('judge').innerHTML = T[ex] ? T[ex].judge : ''; }

function seg(id, cur, on) {
  const el = $(id);
  [...el.children].forEach(b => b.classList.toggle('sel', b.dataset.v === cur));
  el.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; [...el.children].forEach(c => c.classList.toggle('sel', c === b)); on(b.dataset.v); });
}
function apply() {
  $('styleRow').style.display = ex === 'pushup' ? 'grid' : 'none';
  renderText(); setView(view); lastK = -1; t = 0;
  [...$('view').children].forEach(b => b.classList.toggle('sel', b.dataset.v === view));
  $('view').children[2].textContent = ex === 'pushup' ? '위' : '앞';
  if (MOVES[ex]) return;
  const u = new URL(location.href); u.searchParams.set('ex', ex); if (ex === 'pushup') u.searchParams.set('style', pstyle); history.replaceState(null, '', u);
}
seg('ex', ex, (v) => { ex = v; apply(); });
seg('styleRow', pstyle, (v) => { pstyle = v; t = 0; lastK = -1; });
seg('view', view, (v) => setView(v));
seg('tab', 'how', (v) => { $('how').style.display = v === 'how' ? 'block' : 'none'; $('judge').style.display = v === 'judge' ? 'block' : 'none'; });
$('speed').onclick = () => { speed = speed === 1 ? 0.5 : 1; $('speed').textContent = speed === 1 ? '느리게' : '보통 속도'; };
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '멈춤' : '재생'; };
if (q.get('tab') === 'judge') $('tab').children[1].click();
if (!POSE[ex] && !MOVES[ex]) ex = 'squat';
apply();
// 세션 화면에서 동작을 바꿀 때 다시 불러오지 않고 바로 바꿈
addEventListener('message', (e) => { const m = e.data || {}; if (m.type !== 'move' || e.origin !== location.origin) return; ex = m.ex; side = m.side === 'L' ? 'L' : 'R'; back = m.dir === 'back'; t = 0; apply(); });
window.__guide.moves = Object.keys(MOVES);
requestAnimationFrame(frame);
</script>
